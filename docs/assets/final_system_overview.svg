<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
  <rect width="1280" height="620" fill="#fbfbfd"/>
  <style>
    .title{font:700 28px Arial,Helvetica,sans-serif;fill:#111827}
    .h{font:700 22px Arial,Helvetica,sans-serif}
    .t{font:500 18px Arial,Helvetica,sans-serif;fill:#111827}
    .s{font:500 15px Arial,Helvetica,sans-serif;fill:#374151}
    .box{fill:white;stroke-width:3;rx:18}
    .small{fill:#ffffff;stroke-width:2;rx:14}
    .blue{stroke:#2563eb}.orange{stroke:#f97316}.green{stroke:#16a34a}.purple{stroke:#7c3aed}.red{stroke:#ef4444}
    .btxt{fill:#1d4ed8}.otxt{fill:#ea580c}.gtxt{fill:#15803d}.ptxt{fill:#6d28d9}.rtxt{fill:#dc2626}
    .arrow{stroke:#111827;stroke-width:4;fill:none;marker-end:url(#arrow)}
    .arrowb{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrowb)}
    .arrowo{stroke:#f97316;stroke-width:4;fill:none;marker-end:url(#arrowo)}
    .arrowg{stroke:#16a34a;stroke-width:4;fill:none;marker-end:url(#arrowg)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker>
    <marker id="arrowb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="arrowo" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f97316"/></marker>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker>
  </defs>
  <text class="title" x="36" y="48">Final pipeline: generative pseudo-view supervision without pseudo geometry seeding</text>

  <rect class="box blue" x="36" y="82" width="560" height="172"/>
  <text class="h btxt" x="62" y="122">1. Real-view geometry</text>
  <rect class="small blue" x="68" y="146" width="126" height="70"/>
  <text class="s" x="82" y="174">Sparse real</text><text class="s" x="96" y="195">views</text>
  <path class="arrow" d="M205 181 H258"/>
  <rect class="small blue" x="268" y="136" width="150" height="92"/>
  <text class="s" x="288" y="166">InstantSplat</text><text class="s" x="291" y="188">pose + pointmap</text><text class="s" x="325" y="210">init</text>
  <path class="arrow" d="M428 181 H468"/>
  <rect class="small blue" x="478" y="136" width="90" height="92"/>
  <text class="s" x="493" y="168">Real-only</text><text class="s" x="494" y="190">Gaussian</text><text class="s" x="503" y="212">scene</text>

  <rect class="box orange" x="626" y="82" width="618" height="172"/>
  <text class="h otxt" x="652" y="122">2. Pseudo-view generation</text>
  <rect class="small orange" x="660" y="146" width="126" height="70"/><text class="s" x="679" y="175">Adjacent</text><text class="s" x="682" y="196">real pair</text>
  <path class="arrow" d="M800 181 H840"/>
  <rect class="small orange" x="850" y="136" width="110" height="92"/><text class="s" x="867" y="169">ViewCrafter</text><text class="s" x="872" y="192">interpolate</text>
  <path class="arrow" d="M972 181 H1012"/>
  <rect class="small orange" x="1022" y="136" width="90" height="92"/><text class="s" x="1041" y="169">DiFix3D+</text><text class="s" x="1040" y="192">enhance</text>
  <path class="arrow" d="M1124 181 H1164"/>
  <rect class="small orange" x="1174" y="136" width="48" height="92"/><text class="s" x="1184" y="178">RGB</text><text class="s" x="1188" y="199">pose</text>

  <rect class="box green" x="36" y="304" width="560" height="172"/>
  <text class="h gtxt" x="62" y="344">3. Cross-view confidence</text>
  <rect class="small green" x="68" y="368" width="120" height="72"/><text class="s" x="84" y="397">MASt3R /</text><text class="s" x="92" y="418">DUSt3R</text>
  <path class="arrow" d="M200 404 H250"/>
  <rect class="small green" x="260" y="368" width="126" height="72"/><text class="s" x="284" y="397">Aggregate</text><text class="s" x="282" y="418">confidence c</text>
  <path class="arrow" d="M398 404 H448"/>
  <rect class="small green" x="458" y="360" width="110" height="88"/><text class="s" x="479" y="390">Softfloor</text><text class="s" x="473" y="412">w=(.25+.75c)^.5</text>
  <text class="s gtxt" x="214" y="462">down-weight artifacts while preserving background gradients</text>

  <rect class="box purple" x="626" y="304" width="618" height="172"/>
  <text class="h ptxt" x="652" y="344">4. Gaussian optimization</text>
  <rect class="small purple" x="666" y="360" width="150" height="88"/><text class="s" x="688" y="391">Fixed Gaussian</text><text class="s" x="703" y="413">scene init</text>
  <path class="arrow" d="M828 404 H878"/>
  <rect class="small purple" x="888" y="350" width="128" height="58"/><text class="s" x="917" y="384">real loss</text>
  <rect class="small purple" x="888" y="422" width="160" height="42"/><text class="s" x="908" y="448">weighted pseudo loss</text>
  <path class="arrowg" d="M568 404 H880"/>
  <path class="arrow" d="M1028 404 H1080"/>
  <rect class="small purple" x="1090" y="360" width="120" height="88"/><text class="s" x="1113" y="392">novel-view</text><text class="s" x="1121" y="414">rendering</text>

  <rect x="36" y="522" width="1208" height="58" rx="14" fill="#fff" stroke="#d1d5db" stroke-width="2" stroke-dasharray="8 8"/>
  <text class="s btxt" x="66" y="557">Blue: real-view geometry only</text>
  <text class="s otxt" x="342" y="557">Orange: pseudo RGB generation</text>
  <text class="s gtxt" x="646" y="557">Green: confidence weighting</text>
  <text class="s ptxt" x="930" y="557">Purple: 3DGS optimization</text>
  <text class="s rtxt" x="66" y="594">Generated views never seed geometry and do not trigger densification in the final setting.</text>
</svg>
